[package]
name = "ex_gdal_nif"
version = "0.1.0"
edition = "2021"

[lib]
name = "ex_gdal_nif"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
rustler = { version = "0.36", default-features = false, features = ["derive"] }
gdal = { git = "https://github.com/Environmental-Material-Science-Inc/gdal", branch = "master" }
gdal-sys = { git = "https://github.com/Environmental-Material-Science-Inc/gdal", branch = "master", features = ["bundled"] }
gdal-src = { git = "https://github.com/Environmental-Material-Science-Inc/gdal", branch = "master", features = ["internal_drivers"] }

[features]
default = ["nif_version_2_16"]
nif_version_2_16 = ["rustler/nif_version_2_16"]
