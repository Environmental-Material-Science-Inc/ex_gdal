name: Build precompiled NIFs

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build_nif:
    name: NIF ${{ matrix.nif }} - ${{ matrix.job.target }}
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        nif: ["2.16"]
        job:
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: x86_64-unknown-linux-musl, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-24.04-arm }
          - { target: x86_64-apple-darwin, os: macos-14 }
          - { target: aarch64-apple-darwin, os: macos-14 }

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust target (cross-compile)
        if: matrix.job.target == 'x86_64-apple-darwin' && runner.arch == 'ARM64'
        run: rustup target add x86_64-apple-darwin

      - name: Install musl toolchain
        if: contains(matrix.job.target, 'musl')
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y musl-tools
          rustup target add ${{ matrix.job.target }}
          echo "CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_RUSTFLAGS=-C target-feature=-crt-static" >> $GITHUB_ENV

      - name: Get version from tag
        id: tag
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build precompiled NIF
        id: build
        uses: philss/rustler-precompiled-action@v1.1.4
        with:
          project-name: ex_gdal_nif
          project-dir: native/ex_gdal_nif
          project-version: ${{ steps.tag.outputs.version }}
          target: ${{ matrix.job.target }}
          nif-version: ${{ matrix.nif }}
          use-cross: ${{ matrix.job.use-cross && 'true' || '' }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.file-name }}
          path: ${{ steps.build.outputs.file-path }}
          if-no-files-found: error

      - name: Upload to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.build.outputs.file-path }}
